<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Chat Global</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        #chat-box { width: 100%; height: 400px; border: 1px solid #333; background: #1e1e1e; overflow-y: auto; margin-bottom: 10px; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 8px; line-height: 1.4; }
        .msg.sent { background: #0056b3; align-self: flex-end; }
        .msg.received { background: #333; align-self: flex-start; }
        .system { color: #ff9800; font-style: italic; text-align: center; align-self: center; font-size: 13px; }
        #login, #chat-ui { background: #1a1a1a; padding: 20px; border-radius: 8px; border: 1px solid #333; }
        input, button { padding: 10px; background: #2a2a2a; color: white; border: 1px solid #555; border-radius: 4px; }
        button { background: #007bff; font-weight: bold; cursor: pointer; }
        button:hover { background: #0056b3; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="login">
        <h3>Chat Global en Línea</h3>
        <input type="text" id="user-input" placeholder="Tu Nombre de Usuario"><br><br>
        <button onclick="conectar()">Entrar al Chat</button>
    </div>

    <!-- INTERFAZ DE CHAT -->
    <div id="chat-ui" class="hidden">
        <div id="chat-box"></div>
        <input type="text" id="msg-input" placeholder="Escribe un mensaje para todos..." style="width: 70%;">
        <button onclick="enviar()">Enviar</button>
    </div>

    <script>
        let ws;
        let miUsuario = "";

        // REEMPLAZA ESTO: Pon el enlace "wss://" que te dé Render al terminar
        const URL_DE_RENDER = "wss://://onrender.com"; 

        function conectar() {
            miUsuario = document.getElementById('user-input').value.trim();
            if(!miUsuario) return alert('Escribe un nombre');

            ws = new WebSocket(URL_DE_RENDER);

            ws.onopen = () => {
                ws.send(JSON.stringify({ type: 'auth', username: miUsuario }));
                document.getElementById('login').classList.add('hidden');
                document.getElementById('chat-ui').classList.remove('hidden');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const box = document.getElementById('chat-box');

                if (data.type === 'system') {
                    box.innerHTML += `<div class="system">⚙️ ${data.text}</div>`;
                } else if (data.type === 'chat') {
                    const clase = data.username === miUsuario ? 'sent' : 'received';
                    box.innerHTML += `<div class="msg ${clase}"><strong>${data.username}:</strong> ${data.text}</div>`;
                }
                box.scrollTop = box.scrollHeight;
            };
        }

        function enviar() {
            const input = document.getElementById('msg-input');
            if(!input.value.trim()) return;
            ws.send(JSON.stringify({ type: 'chat', text: input.value }));
            input.value = '';
        }
    </script>
</body>
</html>
